<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090d">

<title>THE RETURN | THE HARBOUR — Chapter Two</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #08090d;
    --panel: #101117;
    --red: #a51f32;
    --bright-red: #ff344d;
    --silver: #e7e8ed;
    --muted: #9a9ba8;
    --line: rgba(255,255,255,.12);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
    background: var(--bg);
}

body {
    color: var(--silver);
    background:
        radial-gradient(ellipse at 50% 0%, #291016 0%, transparent 48%),
        var(--bg);
    font-family: 'Inter', sans-serif;
    line-height: 1.9;
    overflow-x: hidden;
}

/* Reading progress */

#readingProgress {
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    height: 3px;
    width: 0;
    background: linear-gradient(90deg, #6e0f20, #ff344d, #f3c2c8);
    box-shadow: 0 0 14px #ff344d;
}

/* Atmospheric background */

.atmosphere {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.atmosphere::before {
    content: "";
    position: absolute;
    inset: -30%;
    background:
        radial-gradient(ellipse at 20% 30%, rgba(115,16,35,.16), transparent 36%),
        radial-gradient(ellipse at 80% 65%, rgba(42,57,83,.13), transparent 38%);
    animation: atmosphereDrift 18s ease-in-out infinite alternate;
}

.atmosphere::after {
    content: "";
    position: absolute;
    inset: 0;
    opacity: .17;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");
}

@keyframes atmosphereDrift {
    from { transform: translate3d(-2%, -1%, 0) scale(1); }
    to   { transform: translate3d(2%, 2%, 0) scale(1.1); }
}

/* Floating embers */

.embers {
    position: fixed;
    inset: 0;
    z-index: 1;
    overflow: hidden;
    pointer-events: none;
}

.ember {
    position: absolute;
    bottom: -20px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #ff5366;
    box-shadow: 0 0 12px 2px rgba(255,52,77,.5);
    opacity: 0;
    animation: rise linear infinite;
}

@keyframes rise {
    0% {
        transform: translate3d(0, 0, 0) scale(.5);
        opacity: 0;
    }
    15% { opacity: .75; }
    80% { opacity: .45; }
    100% {
        transform: translate3d(45px, -110vh, 0) scale(1.4);
        opacity: 0;
    }
}

/* Hero */

.hero {
    min-height: 100svh;
    position: relative;
    isolation: isolate;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 100px 22px 110px;
    overflow: hidden;
    background:
        linear-gradient(to bottom, rgba(8,9,13,.2), rgba(8,9,13,.55) 55%, #08090d 100%),
        radial-gradient(ellipse at 50% 45%, rgba(125,19,39,.22), transparent 55%);
}

.hero::before {
    content: "";
    position: absolute;
    width: min(76vw, 680px);
    aspect-ratio: 1;
    border: 1px solid rgba(255,76,95,.13);
    border-radius: 50%;
    box-shadow:
        0 0 70px rgba(165,31,50,.08),
        inset 0 0 70px rgba(165,31,50,.06);
    animation: sealPulse 7s ease-in-out infinite;
    z-index: -1;
}

.hero::after {
    content: "";
    position: absolute;
    width: min(60vw, 480px);
    aspect-ratio: 1;
    border: 1px solid rgba(255,255,255,.06);
    border-radius: 50%;
    z-index: -1;
}

@keyframes sealPulse {
    0%, 100% { transform: scale(.96); opacity: .6; }
    50% { transform: scale(1.04); opacity: 1; }
}

.eyebrow {
    color: #d1a5aa;
    font-size: .72rem;
    font-weight: 600;
    letter-spacing: .42em;
    text-transform: uppercase;
    margin-bottom: 30px;
    animation: fadeUp 1s .1s both;
}

.hero h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(2.7rem, 9vw, 7rem);
    font-weight: 800;
    letter-spacing: .07em;
    line-height: 1.13;
    color: #fff;
    text-shadow:
        0 0 20px rgba(255,52,77,.2),
        0 0 70px rgba(165,31,50,.24);
    animation: titleReveal 1.5s .2s both;
}

.hero h1 span {
    display: block;
    color: var(--bright-red);
    font-size: .39em;
    font-weight: 500;
    letter-spacing: .42em;
    margin-top: 24px;
    text-shadow: 0 0 28px rgba(255,52,77,.38);
}

.title-rule {
    height: 1px;
    width: min(300px, 65vw);
    margin: 34px auto 25px;
    background: linear-gradient(90deg, transparent, #a51f32, #f4b5bd, #a51f32, transparent);
    box-shadow: 0 0 15px rgba(255,52,77,.3);
    animation: expandRule 1.5s .6s both;
}

.hero-note {
    color: #a8a8b2;
    font-size: .79rem;
    letter-spacing: .15em;
    text-transform: uppercase;
    animation: fadeUp 1s .8s both;
}

.scroll-cue {
    position: absolute;
    bottom: 36px;
    color: #777986;
    font-size: .67rem;
    letter-spacing: .25em;
    text-transform: uppercase;
    animation: fadeUp 1s 1s both;
}

.scroll-cue::after {
    content: "";
    display: block;
    width: 1px;
    height: 35px;
    margin: 12px auto 0;
    background: linear-gradient(#ff344d, transparent);
    animation: cueMove 1.6s infinite;
}

@keyframes cueMove {
    0%, 100% { transform: scaleY(.6); transform-origin: top; opacity: .45; }
    50% { transform: scaleY(1); opacity: 1; }
}

@keyframes titleReveal {
    from { opacity: 0; transform: translateY(25px); filter: blur(9px); }
    to { opacity: 1; transform: translateY(0); filter: blur(0); }
}

@keyframes expandRule {
    from { transform: scaleX(.1); opacity: 0; }
    to { transform: scaleX(1); opacity: 1; }
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(15px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Story area */

.story-wrap {
    position: relative;
    z-index: 2;
    width: min(790px, 100%);
    margin: 0 auto;
    padding: 0 25px 100px;
}

.story-top {
    text-align: center;
    margin: 0 auto 55px;
    padding: 30px 20px;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
}

.story-top p {
    color: #b9bac5;
    font-size: .82rem;
    letter-spacing: .07em;
}

.story-top strong {
    display: block;
    font-family: 'Cinzel', serif;
    color: #e7b0b7;
    letter-spacing: .15em;
    font-size: .9rem;
    margin-bottom: 8px;
}

.story {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1rem, 2.3vw, 1.09rem);
    font-weight: 400;
    line-height: 2.05;
    color: #d2d2d9;
    overflow-wrap: anywhere;
}

.story p {
    margin: 0 0 25px;
    opacity: 0;
    transform: translateY(16px);
    transition:
        opacity .8s ease,
        transform .8s ease;
}

.story p.visible {
    opacity: 1;
    transform: translateY(0);
}

/* Scene separators */

.scene-divider {
    display: flex;
    align-items: center;
    gap: 17px;
    margin: 48px 0;
    color: #d43a50;
    font-family: 'Cinzel', serif;
    font-size: .8rem;
    letter-spacing: .4em;
    opacity: .9;
}

.scene-divider::before,
.scene-divider::after {
    content: "";
    height: 1px;
    flex: 1;
    background: linear-gradient(90deg, transparent, rgba(255,52,77,.6));
}

.scene-divider::after {
    background: linear-gradient(90deg, rgba(255,52,77,.6), transparent);
}

/* Final card */

.ending {
    position: relative;
    margin-top: 90px;
    padding: 60px 25px;
    text-align: center;
    border: 1px solid rgba(255,52,77,.23);
    background:
        linear-gradient(135deg, rgba(94,14,28,.22), transparent 55%),
        rgba(13,14,20,.75);
    box-shadow: 0 0 65px rgba(105,14,30,.1);
    overflow: hidden;
}

.ending::before {
    content: "";
    position: absolute;
    left: 50%;
    top: -100px;
    transform: translateX(-50%);
    width: 250px;
    height: 160px;
    background: rgba(255,52,77,.1);
    filter: blur(65px);
}

.ending-label {
    position: relative;
    color: #a5a5b1;
    font-size: .68rem;
    letter-spacing: .4em;
    text-transform: uppercase;
    margin-bottom: 17px;
}

.ending h2 {
    position: relative;
    font-family: 'Cinzel', serif;
    color: #fff;
    font-size: clamp(1.7rem, 6vw, 3rem);
    letter-spacing: .1em;
    text-shadow: 0 0 30px rgba(255,52,77,.3);
}

.ending .credit {
    position: relative;
    color: #c3a0a5;
    margin-top: 28px;
    font-size: .9rem;
    letter-spacing: .08em;
}

.back-link {
    display: inline-block;
    margin-top: 35px;
    padding: 12px 24px;
    border: 1px solid rgba(255,255,255,.2);
    color: #eee;
    text-decoration: none;
    font-size: .75rem;
    letter-spacing: .12em;
    text-transform: uppercase;
    transition: .3s ease;
}

.back-link:hover {
    border-color: var(--bright-red);
    background: rgba(165,31,50,.15);
    box-shadow: 0 0 25px rgba(255,52,77,.15);
    transform: translateY(-2px);
}

/* Footer */

footer {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 25px 15px 35px;
    color: #646570;
    font-size: .7rem;
    letter-spacing: .13em;
}

footer span {
    color: #ad3346;
}

/* Responsive */

@media (max-width: 600px) {
    .hero { min-height: 90svh; padding-inline: 18px; }
    .eyebrow { letter-spacing: .25em; font-size: .63rem; }
    .hero h1 { letter-spacing: .025em; }
    .hero h1 span { letter-spacing: .28em; }
    .story-wrap { padding-inline: 22px; }
    .story { line-height: 1.95; }
    .ending { padding: 48px 18px; }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>
<div id="readingProgress"></div>
<div class="atmosphere" aria-hidden="true"></div>
<div class="embers" id="embers" aria-hidden="true"></div>

<header class="hero">
    <div class="eyebrow">The Harbour · A Cinematic Thriller</div>

    <h1>
        THE HARBOUR
        <span>CHAPTER TWO</span>
        <div class="title-rule"></div>
        <span style="font-size:.48em;letter-spacing:.2em;color:#f2e9eb;margin-top:0">
            THE RETURN
        </span>
    </h1>

    <p class="hero-note">Every return has a price.</p>

    <a class="scroll-cue" href="#story" style="text-decoration:none">Enter the story</a>
</header>

<main class="story-wrap" id="story">
    <div class="story-top">
        <strong>CHAPTER TWO — THE RETURN</strong>
        <p>The past never stays buried.</p>
    </div>

    <article class="story" id="storyContent">

</main>

</footer>

<script>
// Reading progress bar
const progressBar = document.getElementById('readingProgress');

function updateReadingProgress() {
    const scrollable = document.documentElement.scrollHeight - window.innerHeight;
    const progress = scrollable > 0 ? (window.scrollY / scrollable) * 100 : 0;
    progressBar.style.width = `${Math.min(100, progress)}%`;
}

window.addEventListener('scroll', updateReadingProgress, { passive: true });
window.addEventListener('resize', updateReadingProgress);
updateReadingProgress();

// Subtle floating ember particles
const emberContainer = document.getElementById('embers');

for (let i = 0; i < 24; i++) {
    const ember = document.createElement('span');
    ember.className = 'ember';
    ember.style.left = `${Math.random() * 100}%`;
    ember.style.animationDuration = `${9 + Math.random() * 14}s`;
    ember.style.animationDelay = `${Math.random() * 15}s`;
    ember.style.opacity = `${0.2 + Math.random() * 0.5}`;
    ember.style.transform = `scale(${0.5 + Math.random()})`;
    emberContainer.appendChild(ember);
}

// Reveal paragraphs smoothly as the reader scrolls
const paragraphs = document.querySelectorAll('.story p');

if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                entry.target.classList.add('visible');
                observer.unobserve(entry.target);
            }
        });
    }, { threshold: 0.08 });

    paragraphs.forEach(paragraph => observer.observe(paragraph));
} else {
    paragraphs.forEach(paragraph => paragraph.classList.add('visible'));
}
</script>
</body>
</html>
